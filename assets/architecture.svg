<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Design System Playground architecture: controls update one settings object, the token engine turns it into CSS variables used by the live preview and the two export panels.">
<title>Design System Playground architecture: controls update one settings object, the token engine turns it into CSS variables used by the live preview and the two export panels.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a5b4fc"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#151722"/>
<text x="32" y="44" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e6e8f0" text-anchor="start">Design System Playground</text>
<text x="32" y="68" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3acc2" text-anchor="start">Token settings in, CSS variables and a sample React component out. Static site, no server.</text>
<rect x="24" y="84" width="912" height="362" rx="12" fill="none" stroke="#3a3f5c" stroke-dasharray="4 4"/>
<text x="38" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#7c869f" text-anchor="start">BROWSER  (REACT 18 + VITE + TYPESCRIPT, PLAIN CSS)</text>
<rect x="48" y="118" width="232" height="104" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="64" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">Controls panel</text>
<text x="64" y="164" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">primary and neutral colors</text>
<text x="64" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">spacing, radius, font size</text>
<text x="64" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">theme and density</text>
<rect x="48" y="254" width="232" height="80" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="64" y="280" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">localStorage</text>
<text x="64" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">settings saved and sanitized</text>
<text x="64" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">on load (tokens.ts)</text>
<rect x="340" y="118" width="260" height="104" rx="10" fill="#23273b" stroke="#6366f1" stroke-width="1.5"/>
<rect x="340" y="128" width="3" height="84" rx="1.5" fill="#a5b4fc"/>
<text x="356" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="start">Settings</text>
<text x="356" y="164" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">one validated object</text>
<text x="356" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">clamped to min and max limits</text>
<text x="356" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">reset to defaults</text>
<rect x="340" y="254" width="260" height="118" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="356" y="280" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">Token engine  (lib/)</text>
<text x="356" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">color.ts: 11-step tonal scales,</text>
<text x="356" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">contrast ratio picks text color</text>
<text x="356" y="336" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">tokens.ts: space = base x ratio^(n-1)</text>
<text x="356" y="354" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">css.ts: settings to CSS variables</text>
<rect x="660" y="118" width="252" height="104" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="676" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">Live preview</text>
<text x="676" y="164" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">same CSS, scoped to .ds-scope</text>
<text x="676" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">Button, Input, Card, Badge</text>
<text x="676" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">read only CSS variables</text>
<rect x="660" y="254" width="252" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="676" y="280" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">Export: CSS variables</text>
<text x="676" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">same sheet on :root, copy button</text>
<rect x="660" y="346" width="252" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="676" y="372" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">Export: React Button</text>
<text x="676" y="392" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">codegen.ts sample component</text>
<path d="M280 166 L340 166" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<text x="310" y="158" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#a3acc2" text-anchor="middle">onChange</text>
<path d="M164 222 L164 254" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M470 222 L470 254" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M600 280 L630 280 L630 170 L660 170" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M600 290 L660 290" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M600 340 L630 340 L630 382 L660 382" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<text x="48" y="380" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7c869f" text-anchor="start">Clipboard copy falls back to a hidden textarea when</text>
<text x="48" y="398" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7c869f" text-anchor="start">the async Clipboard API is not available.</text>
</svg>
